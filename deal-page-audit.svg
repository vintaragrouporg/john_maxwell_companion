<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f4ec"/>
      <stop offset="100%" stop-color="#efe7d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b8402a"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #1f2430; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4f5a68; }
      .label { font: 700 17px Arial, sans-serif; fill: #1f2430; }
      .small { font: 400 14px Arial, sans-serif; fill: #5b6472; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #6a7380; }
      .calloutTitle { font: 700 18px Arial, sans-serif; fill: #7d2316; }
      .calloutBody { font: 400 14px Arial, sans-serif; fill: #5d241c; }
      .cardTitle { font: 700 18px Arial, sans-serif; fill: #243042; }
      .metric { font: 700 28px Arial, sans-serif; fill: #172133; }
      .muted { fill: #7a8391; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="72" y="74" class="title">Current Deal Page Audit</text>
  <text x="72" y="106" class="subtitle">Annotated map of the current UI based on the live dashboard route and visible runtime sections.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="980" height="860" rx="28" fill="#fcfaf5" stroke="#d8cfbd"/>
  </g>

  <rect x="70" y="150" width="230" height="860" rx="28" fill="#202c3b"/>
  <text x="100" y="202" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f8f3e8">DealDecision AI</text>
  <rect x="100" y="230" width="170" height="38" rx="12" fill="#f3b663"/>
  <text x="128" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d2330">New Deal</text>
  <text x="100" y="304" class="tiny" fill="#aab4c1">MAIN</text>
  <g fill="#eef3f7" font-family="Arial, sans-serif" font-size="16">
    <text x="100" y="336">Dashboard</text>
    <text x="100" y="370">Deal Pipeline</text>
    <text x="100" y="404">Documents</text>
    <text x="100" y="438">Analytics</text>
    <text x="100" y="472">Compare Deals</text>
    <text x="100" y="506">Reports Generated</text>
  </g>
  <text x="100" y="560" class="tiny" fill="#aab4c1">WORKSPACE</text>
  <g fill="#eef3f7" font-family="Arial, sans-serif" font-size="16">
    <text x="100" y="592">Team</text>
    <text x="100" y="626">Profile</text>
    <text x="100" y="660">Settings</text>
  </g>
  <text x="100" y="716" class="tiny" fill="#aab4c1">SYSTEM</text>
  <g fill="#eef3f7" font-family="Arial, sans-serif" font-size="16">
    <text x="100" y="748">Restart Tour</text>
    <text x="100" y="782">Support</text>
  </g>
  <text x="100" y="836" class="tiny" fill="#aab4c1">DEV / ADMIN</text>
  <g fill="#eef3f7" font-family="Arial, sans-serif" font-size="16">
    <text x="100" y="868">Components</text>
    <text x="100" y="902">Logo Variants</text>
    <text x="100" y="936">System Admin</text>
  </g>

  <rect x="320" y="176" width="690" height="56" rx="18" fill="#f3efe5" stroke="#ddd3c1"/>
  <text x="350" y="210" class="small">Deal Workspace</text>
  <text x="845" y="210" class="small">Ryan Morrow</text>

  <text x="320" y="282" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#182334">Allurion Multi-Doc Audit</text>
  <text x="320" y="314" class="small">de_spac • public_company • Not disclosed • Analyzed Apr 21, 2026</text>

  <rect x="320" y="348" width="690" height="170" rx="22" fill="#fffdf9" stroke="#d8cfbd"/>
  <text x="346" y="382" class="cardTitle">Decision Status</text>
  <text x="346" y="420" class="metric">Investigate</text>
  <text x="520" y="420" class="small">Not Ready to Commit</text>
  <text x="346" y="456" class="small">This opportunity shows potential, but key evidence gaps or contradictions prevent a confident investment decision.</text>
  <text x="346" y="496" class="cardTitle">Signal Tension</text>
  <text x="520" y="496" class="small">High Tension</text>

  <rect x="320" y="540" width="330" height="205" rx="22" fill="#fffdf9" stroke="#d8cfbd"/>
  <text x="344" y="574" class="cardTitle">Opportunity Signal</text>
  <text x="344" y="612" class="small">Mixed opportunity</text>
  <text x="344" y="664" class="metric">44.2</text>
  <text x="430" y="664" class="small">/100</text>
  <text x="344" y="706" class="small">Initial analysis warrants further investigation.</text>

  <rect x="680" y="540" width="330" height="205" rx="22" fill="#fffdf9" stroke="#d8cfbd"/>
  <text x="704" y="574" class="cardTitle">Capital Readiness</text>
  <text x="704" y="612" class="small">Not ready for commitment</text>
  <text x="704" y="664" class="metric">44.2</text>
  <text x="790" y="664" class="small">/100</text>
  <text x="704" y="706" class="small">Would capital commit at current evidence levels?</text>

  <rect x="320" y="767" width="690" height="110" rx="22" fill="#fffdf9" stroke="#d8cfbd"/>
  <text x="346" y="802" class="cardTitle">Key Drivers / Required Checks</text>
  <text x="346" y="834" class="small">Financial data supports analysis • Team credible • Traction confirmed</text>
  <text x="346" y="858" class="small">Cap table clarification • Demand evidence • Product quality evidence • Regulatory timeline</text>

  <rect x="320" y="898" width="330" height="88" rx="22" fill="#fffdf9" stroke="#d8cfbd"/>
  <text x="344" y="934" class="cardTitle">Key Facts</text>
  <text x="344" y="958" class="small">Product, Market, Business Model, Raise Terms</text>

  <rect x="680" y="898" width="330" height="88" rx="22" fill="#fffdf9" stroke="#d8cfbd"/>
  <text x="704" y="934" class="cardTitle">Risk Assessment</text>
  <text x="704" y="958" class="small">Red flags, contradictions, open questions</text>

  <rect x="1040" y="238" width="210" height="274" rx="22" fill="#f7efe0" stroke="#d8cfbd"/>
  <text x="1064" y="274" class="cardTitle">Deep Links</text>
  <text x="1064" y="312" class="small">Deep Dive Panel</text>
  <text x="1064" y="344" class="small">Investor Insights</text>
  <text x="1064" y="376" class="small">Evidence Explorer</text>
  <text x="1064" y="408" class="small">Decision Confidence</text>
  <text x="1064" y="458" class="small">Multiple analysis modes compete in the same visual layer.</text>

  <rect x="1040" y="540" width="210" height="182" rx="22" fill="#f7efe0" stroke="#d8cfbd"/>
  <text x="1064" y="576" class="cardTitle">Recent Activity</text>
  <text x="1064" y="608" class="small">Notifications</text>
  <text x="1064" y="636" class="small">Review</text>
  <text x="1064" y="664" class="small">Reply</text>
  <text x="1064" y="694" class="small">Operational status sits beside the deal verdict.</text>

  <rect x="1040" y="746" width="210" height="150" rx="22" fill="#f7efe0" stroke="#d8cfbd"/>
  <text x="1064" y="782" class="cardTitle">Team</text>
  <text x="1064" y="814" class="small">People, account, workspace</text>
  <text x="1064" y="846" class="small">Useful, but not needed for the first decision.</text>

  <g filter="url(#shadow)">
    <rect x="1270" y="176" width="270" height="132" rx="24" fill="#fff1ea" stroke="#d99881"/>
  </g>
  <text x="1292" y="212" class="calloutTitle">1. Navigation is overloaded</text>
  <text x="1292" y="240" class="calloutBody">Analyst tasks, system settings, dev tools,</text>
  <text x="1292" y="260" class="calloutBody">and admin controls all read as primary navigation.</text>
  <path d="M1270 250 C1210 250, 1160 270, 250 820" fill="none" stroke="#b8402a" stroke-width="3" marker-end="url(#arrowRed)"/>

  <g filter="url(#shadow)">
    <rect x="1270" y="338" width="270" height="138" rx="24" fill="#fff1ea" stroke="#d99881"/>
  </g>
  <text x="1292" y="374" class="calloutTitle">2. Verdict is split across cards</text>
  <text x="1292" y="402" class="calloutBody">Decision status, opportunity score, capital</text>
  <text x="1292" y="422" class="calloutBody">readiness, and tension all compete instead of</text>
  <text x="1292" y="442" class="calloutBody">forming one clear answer.</text>
  <path d="M1270 430 C1215 430, 1170 420, 995 432" fill="none" stroke="#b8402a" stroke-width="3" marker-end="url(#arrowRed)"/>

  <g filter="url(#shadow)">
    <rect x="1270" y="510" width="270" height="126" rx="24" fill="#fff1ea" stroke="#d99881"/>
  </g>
  <text x="1292" y="546" class="calloutTitle">3. Required checks are buried</text>
  <text x="1292" y="574" class="calloutBody">The actions that unblock a decision appear after</text>
  <text x="1292" y="594" class="calloutBody">multiple metrics and explanations.</text>
  <path d="M1270 590 C1190 650, 1100 760, 860 790" fill="none" stroke="#b8402a" stroke-width="3" marker-end="url(#arrowRed)"/>

  <g filter="url(#shadow)">
    <rect x="1270" y="668" width="270" height="126" rx="24" fill="#fff1ea" stroke="#d99881"/>
  </g>
  <text x="1292" y="704" class="calloutTitle">4. Diagnostics crowd first paint</text>
  <text x="1292" y="732" class="calloutBody">Deep-dive tools, evidence explorer, jobs, and</text>
  <text x="1292" y="752" class="calloutBody">activity appear before users know the headline.</text>
  <path d="M1270 742 C1225 730, 1175 630, 1150 512" fill="none" stroke="#b8402a" stroke-width="3" marker-end="url(#arrowRed)"/>

  <g filter="url(#shadow)">
    <rect x="1270" y="826" width="270" height="126" rx="24" fill="#fff1ea" stroke="#d99881"/>
  </g>
  <text x="1292" y="862" class="calloutTitle">5. Too many abstraction levels</text>
  <text x="1292" y="890" class="calloutBody">User-facing insights, evidence plumbing, and</text>
  <text x="1292" y="910" class="calloutBody">system telemetry are intermixed on one screen.</text>
  <path d="M1270 900 C1210 900, 1140 920, 960 940" fill="none" stroke="#b8402a" stroke-width="3" marker-end="url(#arrowRed)"/>

  <text x="70" y="1054" class="small">Observed runtime data sources: /me/access, /deals, /deals/:id, /documents, /governed-llm-overview, /investor-insights, /analysis-diagnostics, /evidence, /events, /jobs, /report/1.</text>
</svg>
